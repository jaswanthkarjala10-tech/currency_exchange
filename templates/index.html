<!DOCTYPE html>
<html>
<head>
<title>BNP Forex KYC</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{background:white;padding:20px;border-radius:10px;max-width:600px;margin:auto}
input,select{width:100%;padding:10px;margin:8px 0}
button{background:#004d40;color:white;padding:12px;width:100%;border:none;border-radius:5px;font-size:16px;cursor:pointer}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
.high{background:#ffebee;color:red;font-weight:bold}
.low{background:#e8f5e9;color:green}
</style>
</head>
<body>
<div class="card">
<h2>BNP Paribas - Forex KYC Verification</h2>
<form action="/add" method="POST">
<input type="text" name="name" placeholder="Customer Name" required>
<select name="country" required>
<option value="">Select Country</option>
<option value="India">India</option>
<option value="USA">USA</option>
<option value="UK">UK</option>
<option value="Iran">Iran</option>
<option value="North Korea">North Korea</option>
<option value="Syria">Syria</option>
</select>
<input type="text" name="idproof" placeholder="ID Proof Number" required>
<button type="submit">Verify KYC</button>
</form>

<h3>Customer List</h3>
<table>
<tr><th>ID</th><th>Name</th><th>Country</th><th>Risk</th><th>Status</th></tr>
{% for c in customers %}
<tr class="{{ 'high' if c[3]=='HIGH' else 'low' }}">
<td>{{c[0]}}</td><td>{{c[1]}}</td><td>{{c[2]}}</td><td>{{c[3]}}</td><td>{{ 'BLOCKED' if c[4]==1 else 'APPROVED' }}</td>
</tr>
{% endfor %}
</table>
</div>
</body>
</html>
